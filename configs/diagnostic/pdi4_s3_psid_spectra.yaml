name: psid_diagnostic_pdi4_s3
description: >
  PSID over-parameterization diagnostic for PDI4_S3.
  Two stories (ECoG monopolar vs laplacian) decoding the same behavior
  (tracing_velocity_x, tracing_acceleration_magnitude).
  Runs vanilla PSID (no eigenvalue damping, no RTS smoother) to make
  singular spectra interpretable as raw subspace-identification evidence
  of effective (n1, nx). Also renders per-family correlation heatmaps
  with hierarchical-cluster ordering to reveal within-family redundancy
  before mRMR feature selection.

data:
  root: resampled_recordings/participants_at_200Hz_scaled_1e6_narrow_band
  participant: PDI4
  session: '3'
  blocks: all
  dbs_condition: both

behavior_targets:
  - tracing_velocity_x
  - tracing_acceleration_magnitude

feature_families:
  - name: ecog
    description: All monopolar ECoG channels × all narrow-band features (60 total)
    pattern: "^ECOG_[1-4]_.*_raw$"
  - name: laplacian
    description: LAPLACIAN_14-16 (stimulation site) × all 15 narrow-band features
    pattern: "^LAPLACIAN_14-16_LFP_.*_raw$"

preprocessing:
  trial_tukey_alpha: 0.1        # 5% taper at each trial end → gentle fade to 0

psid:
  nx: 25                        # matches existing PDI4_S3 behavioral run for comparability
  n1: 2                         # = dim(Z); the spectrum shows whether this is enough
  i: 35                         # Hankel horizon (block rows), matches existing setup
  time_first: true
  max_eigenvalue: null          # VANILLA — no A-matrix eigenvalue damping
  backward_kalman: false        # VANILLA — no RTS smoother Cz re-fit
  zscore_Y: true
  zscore_Z: true

results:
  output_dir: results/diagnostic/pdi4_s3_psid_spectra
