framework:
  name: psid_diagnostic
  params:
    nx_grid: [4, 8, 16, 32, 64]
    n1_grid: [1, 2, 4, 8, 16, 32]
    K_Y: 12
    K_Z: 12
    stratify_raw_env: true
    mrmr_method: MIQ
    mrmr_epoch_len_s: 2.0
    i_horizon: 50
    i_train: 100
    max_eig: 0.999
    history_s: 5.0
    forecast_s: 2.0

data:
  root: resampled_recordings/participants_at_200Hz_scaled_1e6_raw_envelope
  participant: PDI1
  session: 2
  sampling_frequency: 200

experiment:
  name: {framework.name}_{data.participant}_S{data.session}_{experiment.type}
  type: z-as-neural    # z-as-behavior | z-as-neural
  # Regex patterns selecting candidate columns from parquet files.
  # Y_label: neural input candidates — column included if any pattern matches.
  # Z_label: output candidates (z-as-neural only).
  #          null → skip Z mRMR, include ALL matching columns without selection.
  Y_label:
    - "^ECOG_.*_raw$"             # raw-band ECoG
    - "^ECOG_.*_env$"             # envelope ECoG
  Z_label:
    - "^LAPLACIAN_.*_LFP_.*_raw$" # raw LFP laplacian bands
    - "^LAPLACIAN_.*_LFP_.*_env$" # envelope LFP laplacian bands
    # set to null to disable Z feature selection and use all LFP columns

results:
  project_root: "."
  save_dir: training/setups/{framework.name}   # emits a psid_run.yaml ready for the full pipeline
  log_dir: logs/{framework.name}
