# PSID run on the fake session written by generate_data.py.
# Y/Z, nx, n1 and i are placeholders — running the psid_diagnostic config for
# this session overwrites them with its selections, exactly as for a real one.
# Small dimensions and grids keep a local run to well under a minute.
framework:
  name: psid
  params:
    nx: 8
    n1: 2
    i: 5
    A_eigen_constrain: 0.9999
    time_first: true
    fast: true
    reuse_splits: false
data:
  root: fake_data/participants_fake_200Hz
  participant: FAKE1
  session: 1
  Y:
  - ECOG_1_beta_18_23_raw
  - ECOG_1_gamma_88_93_raw
  - ECOG_2_beta_18_23_raw
  - ECOG_2_gamma_88_93_raw
  - ECOG_3_beta_18_23_raw
  - ECOG_3_gamma_88_93_raw
  - ECOG_1_beta_18_23_env
  - ECOG_1_gamma_88_93_env
  - ECOG_2_beta_18_23_env
  - ECOG_2_gamma_88_93_env
  - ECOG_3_beta_18_23_env
  - ECOG_3_gamma_88_93_env
  Z:
  - tracing_velocity_x
  - tracing_acceleration_magnitude
  sampling_frequency: 200
experiment:
  name: psid_FAKE1_S1_z-as-behavior
  type: z-as-behavior
  train:
    model_dbs_state:
    - both
    - 'on'
    - 'off'
  predictions:
    splits:
    - train
    - val
    - test
  forecasts:
    default_h: 2.0
    default_m: 0.5
    h_grid:
    - 1.0
    - 2.0
    m_test_grid:
    - 0.5
  classification:
    m_seconds: 0.5
    epoch_length: 0.5
    epoch_overlap: 0.25
    n_splits: 2
    t_cut_grid:
    - 1
    - 2
    perm_ba_gate: 0.5
    n_permutations: 20
    prediction_significance_window: 0.5
    forecast_insignificance_window: 0.1
    param_grid:
      LDA:
        classifier__solver:
        - lsqr
        classifier__shrinkage:
        - auto
    feature_sources_pred:
    - Xp
    - Xp_1
    feature_sources_forecast:
    - Xf
    - Xf_1
results:
  project_root: .
  save_dir: results/{framework.name}/{experiment.name}
  model_dir: results/{framework.name}/{experiment.name}
  log_dir: logs/{framework.name}
  checkpoint_dir: checkpoints/{framework.name}
  setups_dir: training/setups/{framework.name}
