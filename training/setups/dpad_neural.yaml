model:
  name: "dpad_neural"
  nx: 4
  n1: 2
  method_code: "DPAD_uAKCzCy2HL128U" 
  epochs: 2500
  forecast:
    m: 1 # seconds

data:
  root: "resampled_recordings/participants_at_60Hz"
  participant: "PDI1"
  session: "2"
  blocks: [1, 2, 3, 4, 5]
  preprocess: true
  channels:
    is_behavioral_neural: true  # if we predict output, this should be true
    input: ["ECOG_1"] 
    output: ["ECOG_4"] 
  split:
    within_session_split: true
    train: 0.6  
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "off"

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
