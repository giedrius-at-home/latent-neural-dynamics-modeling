framework:
  name: varma
  params:
    p: 30
    q: 1
    long_ar_lags: 30
    ridge_alpha: 1.0
    max_root: 0.97
    trial_edge_taper_sec: 0.1
    time_first: true
    fast: true
    reuse_splits: false
data:
  root: resampled_recordings/participants_at_200Hz_scaled_1e6_raw_envelope
  participant: PDI4
  session: 3
  Y:
  - ECOG_1_beta_23_28_raw
  - ECOG_2_beta_28_32_raw
  - ECOG_3_beta_23_28_raw
  - ECOG_2_beta_23_28_raw
  - ECOG_4_beta_23_28_raw
  - ECOG_3_beta_28_32_raw
  - ECOG_2_beta_23_28_env
  - ECOG_1_beta_18_23_env
  - ECOG_1_gamma_32_37_env
  - ECOG_1_beta_23_28_env
  - ECOG_4_beta_28_32_env
  - ECOG_2_gamma_32_37_env
  Z:
  - tracing_velocity_x
  - tracing_acceleration_magnitude
  sampling_frequency: 200
experiment:
  name: '{framework.name}_{experiment.type}_{data.participant}_S{data.session}_p{framework.params.p}_q{framework.params.q}'
  type: z-as-behavior
  train:
    model_dbs_state:
    - both
    - 'on'
    - 'off'
  predictions:
    splits:
    - train
    - val
    - test
  forecasts:
    default_h: 5.0
    default_m: 2.0
    h_grid:
    - 0.5
    - 1.0
    - 1.5
    - 2.0
    - 3.0
    - 4.0
    - 5.0
    m_test_grid:
    - 0.5
    - 1.0
    - 1.5
    - 2.0
results:
  project_root: .
  save_dir: results/{framework.name}/{experiment.name}
  model_dir: results/{framework.name}/{experiment.name}
  log_dir: logs/{framework.name}
  checkpoint_dir: checkpoints/{framework.name}
  setups_dir: training/setups/{framework.name}
