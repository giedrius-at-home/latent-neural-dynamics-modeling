model:
  name: "psid_SEARCH_lowbeta_ecog"
  nx: 8  
  n1: 6 
  i: 60
  time_first: true
  fast: false
  reuse_splits: true
  # R_scale: 20.0
  # S_scale: 1.0
  # Q_scale: 1.0 
  forecast:
    m: 1 
    history: 2 

data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6_full_features" 
  participant: "PDI1"
  session: "2"
  blocks: "all"
  channels:
    is_behavioral_neural: false
    neural_input: [
      "ECOG_1_lowbeta", "ECOG_2_lowbeta", "ECOG_3_lowbeta", "ECOG_4_lowbeta"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_x", "tracing_velocity_y", "tracing_velocity_magnitude"
    ]
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
