model:
  name: "psid_behavioral_all_blocks_dbs_both"
  nx: 4  
  n1: 2 
  i: 30
  time_first: true
  forecast:
    m: 1 
    history: 2 

data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6" 
  participant: "PDI1"
  session: "2"
  blocks: "all"
  channels:
    is_behavioral_neural: false
    input: ["ECOG_1", "ECOG_2", "ECOG_3", "ECOG_4"] 
    output: ["tracing_velocity_magnitude"]  
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0.01

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"