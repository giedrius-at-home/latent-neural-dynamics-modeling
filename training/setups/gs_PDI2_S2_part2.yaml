model:
  name: psid_grid_search_PDI2_S2_part2
  i: 80
  time_first: true
  reuse_splits: true
  forecast:
    m: 2
    history: 5
  grid_search:
    nx:
    - 5
    - 10
    - 15
    - 20
    n1:
    - 4
    - 8
    - 12
    - 16
    alpha_Q:
    - 1e-5
    - 1e-4
    - 1e-3
    alpha_R:
    - 1e-3
    - 1e-2
    backward_kalman:
    - true
    rescale_states:
    - true
    max_eigenvalue:
    - 0.995
    neural_bands:
    - - ECOG_1_lowbeta_env
      - ECOG_2_lowbeta_env
      - ECOG_3_lowbeta_env
      - ECOG_4_lowbeta_env
    - - ECOG_1_highbeta_env
      - ECOG_2_highbeta_env
      - ECOG_3_highbeta_env
      - ECOG_4_highbeta_env
    behavioral_outputs:
    - - tracing_velocity_magnitude
      - tracing_velocity_x
      - tracing_velocity_y
data:
  root: resampled_recordings/participants_at_60Hz_scaled_1e6_all_bands_raw_05_28
  participant: PDI2
  session: '2'
  blocks: all
  channels:
    neural_input:
    - ECOG_1_beta
    - ECOG_2_beta
    - ECOG_3_beta
    - ECOG_4_beta
    output_type: behavioral
    output:
    - tracing_velocity_magnitude
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: both
  jitter: 0
results:
  save_dir: results/psid_grid_search_part2
  log_dir: '{results.save_dir}/logs'
  checkpoint_dir: checkpoints
