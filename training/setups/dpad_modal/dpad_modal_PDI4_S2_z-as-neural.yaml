framework:
  name: dpad
  params:
    nx: 64
    n1: 4
    epochs: 1000
    checkpoint_every: 100
    method_code: DPAD_uAKCzCy2HL32U
    fast: true
    reuse_splits: false
    steps_ahead:
    - 1
    steps_ahead_loss_weights:
    - 1.0
data:
  root: resampled_recordings/participants_at_200Hz_scaled_1e6_raw_envelope
  participant: PDI4
  session: 2
  Y:
  - ECOG_2_gamma_83_88_raw
  - ECOG_1_beta_28_32_raw
  - ECOG_1_theta_4_8_raw
  - ECOG_1_gamma_83_88_raw
  - ECOG_2_beta_28_32_raw
  - ECOG_2_gamma_88_93_raw
  - ECOG_2_gamma_83_88_env
  - ECOG_1_gamma_88_93_env
  - ECOG_1_theta_4_8_env
  - ECOG_3_alpha_8_12_env
  - ECOG_2_beta_23_28_env
  - ECOG_1_gamma_42_47_env
  Z:
  - LAPLACIAN_10-12_LFP_gamma_78_83_raw
  - LAPLACIAN_13-15_LFP_theta_4_8_raw
  - LAPLACIAN_11-13_LFP_theta_4_8_raw
  - LAPLACIAN_9-11_LFP_gamma_78_83_raw
  - LAPLACIAN_13-15_LFP_alpha_8_12_raw
  - LAPLACIAN_12-14_LFP_alpha_8_12_raw
  - LAPLACIAN_10-12_LFP_gamma_78_83_env
  - LAPLACIAN_11-13_LFP_gamma_73_78_env
  - LAPLACIAN_10-12_LFP_theta_4_8_env
  - LAPLACIAN_13-15_LFP_alpha_8_12_env
  - LAPLACIAN_12-14_LFP_gamma_68_73_env
  - LAPLACIAN_11-13_LFP_gamma_42_47_env
  sampling_frequency: 200
experiment:
  name: '{framework.name}_{experiment.type}_{data.participant}_S{data.session}_nx_{framework.params.nx}_n1_{framework.params.n1}_e{framework.params.epochs}'
  type: z-as-neural
  train:
    model_dbs_state:
    - both
    - 'on'
    - 'off'
  predictions:
    splits:
    - train
    - val
    - test
  forecasts:
    default_h: 5.0
    default_m: 2.0
    h_grid:
    - 5.0
    m_test_grid:
    - 2.0
  classification:
    epoch_length: 0.5
    epoch_overlap: 0.25
    n_splits: 5
    t_cut_grid:
    - 0.5
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    perm_ba_gate: 0.5
    n_permutations: 100
    prediction_significance_window: 0.5
    forecast_insignificance_window: 0.1
    param_grid:
      LDA:
        classifier__solver:
        - lsqr
        classifier__shrinkage:
        - auto
    feature_sources_pred:
    - Xp
    - Xp_1
    - Xp_2
    - Xp_with_dbs
    feature_sources_forecast:
    - Xf
    - Xf_1
    - Xf_2
    - Xf_with_dbs
results:
  project_root: .
  save_dir: results/{framework.name}/{experiment.name}
  model_dir: results/{framework.name}/{experiment.name}
  log_dir: logs/{framework.name}
  checkpoint_dir: checkpoints/{framework.name}
  setups_dir: training/setups/{framework.name}
