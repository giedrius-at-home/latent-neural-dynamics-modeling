framework:
  name: dpad
  params:
    nx: 64
    n1: 4
    epochs: 1000
    checkpoint_every: 100
    method_code: DPAD_uAKCzCy2HL32U
    fast: true
    reuse_splits: false
    steps_ahead:
    - 1
    steps_ahead_loss_weights:
    - 1.0
data:
  root: resampled_recordings/participants_at_200Hz_scaled_1e6_raw_envelope
  participant: PDI1
  session: 4
  Y:
  - ECOG_2_theta_4_8_raw
  - ECOG_4_gamma_68_73_raw
  - ECOG_3_gamma_73_78_raw
  - ECOG_3_gamma_63_68_raw
  - ECOG_4_gamma_53_58_raw
  - ECOG_4_alpha_8_12_raw
  - ECOG_1_gamma_37_42_env
  - ECOG_3_theta_4_8_env
  - ECOG_3_beta_13_18_env
  - ECOG_3_gamma_68_73_env
  - ECOG_2_gamma_42_47_env
  - ECOG_3_gamma_78_83_env
  Z:
  - tracing_velocity_x
  - tracing_acceleration_magnitude
  sampling_frequency: 200
experiment:
  name: '{framework.name}_{experiment.type}_{data.participant}_S{data.session}_nx_{framework.params.nx}_n1_{framework.params.n1}_e{framework.params.epochs}'
  type: z-as-behavior
  train:
    model_dbs_state:
    - both
    - 'on'
    - 'off'
  predictions:
    splits:
    - train
    - val
    - test
  forecasts:
    default_h: 5.0
    default_m: 2.0
    h_grid:
    - 5.0
    m_test_grid:
    - 2.0
  classification:
    m_seconds: 0.5
    epoch_length: 0.5
    epoch_overlap: 0.25
    n_splits: 5
    t_cut_grid:
    - 0.5
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    perm_ba_gate: 0.5
    n_permutations: 500
    prediction_significance_window: 0.5
    forecast_insignificance_window: 0.1
    param_grid:
      LDA:
        classifier__solver:
        - lsqr
        classifier__shrinkage:
        - auto
    feature_sources_pred:
    - Xp
    - Xp_1
    - Xp_2
    - Xp_with_dbs
    feature_sources_forecast:
    - Xf
    - Xf_1
    - Xf_2
    - Xf_with_dbs
results:
  project_root: .
  save_dir: results/{framework.name}/{experiment.name}
  model_dir: results/{framework.name}/{experiment.name}
  log_dir: logs/{framework.name}
  checkpoint_dir: checkpoints/{framework.name}
  setups_dir: training/setups/{framework.name}
