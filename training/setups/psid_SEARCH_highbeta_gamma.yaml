model:
  name: "psid_SEARCH_highbeta_gamma"
  nx: 5
  n1: 2
  i: 20
  time_first: true
  fast: true
  reuse_splits: true
  Q_scale: 20.0
  R_scale: 20.0
  S_scale: 20.0
  forecast:
    m: 1 
    history: 2 

data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6_full_features" 
  participant: "PDI1"
  session: "2"
  blocks: "all"
  channels:
    is_behavioral_neural: false
    neural_input: [
      "LFP_1_highbeta", "LFP_2_highbeta", "LFP_3_highbeta", "LFP_4_highbeta", "LFP_5_highbeta", "LFP_6_highbeta", "LFP_7_highbeta", "LFP_8_highbeta",
      "LFP_9_highbeta", "LFP_10_highbeta", "LFP_11_highbeta", "LFP_12_highbeta", "LFP_13_highbeta", "LFP_14_highbeta", "LFP_15_highbeta", "LFP_16_highbeta",
      "ECOG_1_highbeta", "ECOG_2_highbeta", "ECOG_3_highbeta", "ECOG_4_highbeta",
      "LFP_1_gamma", "LFP_2_gamma", "LFP_3_gamma", "LFP_4_gamma", "LFP_5_gamma", "LFP_6_gamma", "LFP_7_gamma", "LFP_8_gamma",
      "LFP_9_gamma", "LFP_10_gamma", "LFP_11_gamma", "LFP_12_gamma", "LFP_13_gamma", "LFP_14_gamma", "LFP_15_gamma", "LFP_16_gamma",
      "ECOG_1_gamma", "ECOG_2_gamma", "ECOG_3_gamma", "ECOG_4_gamma"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_x", "tracing_velocity_y",
      "tracing_velocity_cos", "tracing_velocity_sin",
      "tracing_acceleration_x", "tracing_acceleration_y",
      "tracing_acceleration_cos", "tracing_acceleration_sin",
      "tracing_jerk_x", "tracing_jerk_y",
      "tracing_jerk_cos", "tracing_jerk_sin"
    ]
    input_lag: null
  neural_shift: null       # ms, -150 = use Y_{t+150ms} -> Z_t
  behavioral_shift: -150   # ms, -150 = predict Z_{t+150ms} from Y_t
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
