model:
  name: "dpad_behavioral_all_blocks_dbs_both_smaller_LFP_ECOG"
  nx: 16  
  n1: 8  
  method_code: "DPAD_uAKCzCy1HL32URGLDrop" 
  epochs: 1500
  forecast:
    m: 1  
    history: 2  
data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6" 
  participant: "PDI1"
  session: "2"
  blocks: "all"
  channels:
    is_behavioral_neural: true
    input: ["LFP_8", "LFP_9", "LFP_10", "LFP_11", "LFP_12", "LFP_13", "LFP_14", "LFP_15"] 
    output: ["ECOG_1", "ECOG_2", "ECOG_3", "ECOG_4"] 
    input_lag: null    
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
