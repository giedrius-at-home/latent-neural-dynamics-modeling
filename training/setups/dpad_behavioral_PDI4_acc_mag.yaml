model:
  name: "dpad_behavioral_PDI4_acc_mag"
  nx: 25  
  n1: 12  
  method_code: "DPAD_uAKCzCy2HL128U" 
  epochs: 2500
  forecast:
    m: 1  
    history: 2  
data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6_full_behavioral_fixed" 
  participant: "PDI4"
  session: "3"
  blocks: "all"
  channels:
    is_behavioral_neural: false
    input: ["LFP_1_envelope", "LFP_1", "LFP_2_envelope", "LFP_2", "LFP_8_envelope", "LFP_8", "LFP_11_envelope", "LFP_11", "LFP_16_envelope", "LFP_16", "LFP_10_envelope", "LFP_10"] 
    output: ["tracing_acceleration_x", "tracing_jerk_x", "tracing_acceleration_y", "tracing_jerk_y"]
    input_lag: null    
  split:
    within_session_split: true
    train: 0.7
    val: 0.2
    test: 0.1
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
