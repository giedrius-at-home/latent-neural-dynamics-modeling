model:
  name: psid_behavioral_PDI4_3_nx_15_n8_i80_dbs_off_narrow_band
  nx: 15
  n1: 8
  i: 80
  time_first: true
  fast: false
  reuse_splits: false
  alpha_Q: 0.0001
  alpha_R: 0.01
  backward_kalman: true
  rescale_states: true
  max_eigenvalue: 0.995
  add_process_noise_in_forecast: false
  forecast:
    m: 2
    history: 5
data:
  root: resampled_recordings/participants_at_80Hz_scaled_1e6_narrow_band
  participant: PDI4
  session: '3'
  blocks: all
  channels:
    neural_input:
    - ECOG_1_highbeta_raw
    - LFP_13_highbeta_raw
    - LFP_14_delta_raw
    - ECOG_1_delta_raw
    - LFP_9_delta_raw
    - LFP_12_alpha_raw
    - LFP_12_delta_raw
    - ECOG_2_highbeta_raw
    - LFP_11_theta_raw
    - LFP_9_alpha_raw
    - LFP_16_alpha_raw
    - LFP_10_theta_raw
    - LFP_10_highbeta_raw
    - LFP_12_theta_raw
    - LFP_13_alpha_raw
    - LFP_10_alpha_raw
    - LFP_16_delta_raw
    - LFP_11_highbeta_raw
    - LFP_14_highbeta_raw
    - LFP_15_alpha_raw
    output_type: behavioral
    output:
    - tracing_velocity_y
    - tracing_velocity_x
    - tracing_jerk_x
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 80
  dbs_condition: 'off'
  jitter: 0
results:
  save_dir: results/{model.name}
  log_dir: '{results.save_dir}/logs'
  checkpoint_dir: checkpoints
