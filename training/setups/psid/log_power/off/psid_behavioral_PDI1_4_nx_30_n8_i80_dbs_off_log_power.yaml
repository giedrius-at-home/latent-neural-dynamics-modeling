model:
  name: psid_behavioral_PDI1_4_nx_30_n8_i80_dbs_off_log_power
  nx: 30
  n1: 8
  i: 80
  time_first: true
  fast: false
  reuse_splits: false
  alpha_Q: 0.001
  alpha_R: 0.01
  backward_kalman: true
  rescale_states: true
  max_eigenvalue: 0.995
  forecast:
    m: 2
    history: 5
data:
  root: resampled_recordings/participants_at_80Hz_scaled_1e6_log
  participant: PDI1
  session: '4'
  blocks: all
  channels:
    neural_input:
    - ECOG_3_highbeta_log_power
    - ECOG_3_beta_log_power
    - LFP_12_delta_log_power
    - LFP_11_delta_log_power
    - LFP_10_delta_log_power
    - ECOG_2_beta_log_power
    - LFP_13_delta_log_power
    - LFP_15_lowbeta_log_power
    - LFP_16_delta_log_power
    - ECOG_3_lowbeta_log_power
    - LFP_14_lowbeta_log_power
    - LFP_9_delta_log_power
    - LFP_15_delta_log_power
    - LFP_14_delta_log_power
    - ECOG_2_highbeta_log_power
    - LFP_15_theta_log_power
    - LFP_14_theta_log_power
    - LFP_13_lowbeta_log_power
    - ECOG_2_lowbeta_log_power
    - LFP_13_theta_log_power
    output_type: behavioral
    output:
    - tracing_velocity_x
    - tracing_velocity_y
    - tracing_velocity_magnitude
    - tracing_jerk_x
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 80
  dbs_condition: 'off'
  jitter: 0
results:
  save_dir: results/{model.name}
  log_dir: '{results.save_dir}/logs'
  checkpoint_dir: checkpoints
