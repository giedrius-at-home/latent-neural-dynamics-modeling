model:
  name: "psid_behavioral_PDI4_3_nx15_n4_i80_dbs_both"
  nx: 15  
  n1: 4 
  i: 80
  time_first: true
  fast: false
  reuse_splits: true
  alpha_Q: 1e-5
  alpha_R: 1e-3
  backward_kalman: true
  rescale_states: true
  max_eigenvalue: 0.995
  forecast:
    m: 2
    history: 5 

data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6_all_bands_raw_05_28" 
  participant: "PDI4"
  session: "3"
  blocks: "all"
  channels:
    neural_input: [
      "ECOG_1_delta_raw", "ECOG_2_delta_raw", "ECOG_3_delta_raw", "ECOG_4_delta_raw",
      "ECOG_1_theta_env", "ECOG_2_theta_env", "ECOG_3_theta_env", "ECOG_4_theta_env",
      "ECOG_1_alpha_env", "ECOG_2_alpha_env", "ECOG_3_alpha_env", "ECOG_4_alpha_env",
      "ECOG_1_lowbeta_env", "ECOG_2_lowbeta_env", "ECOG_3_lowbeta_env","ECOG_4_lowbeta_env",
      "ECOG_1_beta_env", "ECOG_2_beta_env", "ECOG_3_beta_env", "ECOG_4_beta_env",
      "ECOG_1_highbeta_env", "ECOG_2_highbeta_env", "ECOG_3_highbeta_env", "ECOG_4_highbeta_env"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_x", "tracing_velocity_y", "tracing_velocity_magnitude",
      "tracing_acceleration_x", "tracing_acceleration_y", "tracing_acceleration_magnitude",
      "tracing_jerk_x", "tracing_jerk_y", "tracing_jerk_magnitude"
    ]
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
