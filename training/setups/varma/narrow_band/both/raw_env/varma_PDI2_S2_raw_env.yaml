model:
  name: "varma_PDI2_S2_raw_env"
  p: 40
  q: 1
  long_ar_lags: 30
  time_first: true
  fast: false
  reuse_splits: false
  forecast:
    m: 2
    history: 5

data:
  root: "resampled_recordings/participants_at_80Hz_scaled_1e6_narrow_band"
  participant: "PDI2"
  session: "2"
  blocks: "all"
  channels:
    neural_input: [
      "ECOG_1_delta_raw",
      "ECOG_1_theta_raw",
      "ECOG_1_alpha_raw",
      "ECOG_1_lowbeta_env",
      "ECOG_1_beta_env",
      "ECOG_1_highbeta_env",
      "ECOG_2_delta_raw",
      "ECOG_2_theta_raw",
      "ECOG_2_alpha_raw",
      "ECOG_2_lowbeta_env",
      "ECOG_2_beta_env",
      "ECOG_2_highbeta_env",
      "ECOG_3_delta_raw",
      "ECOG_3_theta_raw",
      "ECOG_3_alpha_raw",
      "ECOG_3_lowbeta_env",
      "ECOG_3_beta_env",
      "ECOG_3_highbeta_env",
      "ECOG_4_delta_raw",
      "ECOG_4_theta_raw",
      "ECOG_4_alpha_raw",
      "ECOG_4_lowbeta_env",
      "ECOG_4_beta_env",
      "ECOG_4_highbeta_env"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_x",
      "tracing_acceleration_y",
      "tracing_acceleration_magnitude",
      "tracing_jerk_y",
      "tracing_jerk_magnitude"
    ]
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 80
  dbs_condition: "both"

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
