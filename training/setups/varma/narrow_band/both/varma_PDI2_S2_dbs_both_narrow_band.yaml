model:
  name: "varma_PDI2_S2_dbs_both_narrow_band"
  p: 30
  q: 1
  long_ar_lags: 30
  time_first: true
  fast: false
  reuse_splits: false
  forecast:
    m: 2
    history: 5

data:
  root: "resampled_recordings/participants_at_80Hz_scaled_1e6_narrow_band"
  participant: "PDI2"
  session: "2"
  blocks: "all"
  channels:
    neural_input: [
      "ECOG_3_highbeta_raw",
      "ECOG_4_highbeta_raw",
      "ECOG_4_lowbeta_raw",
      "ECOG_4_theta_raw",
      "ECOG_4_beta_raw",
      "ECOG_3_beta_raw",
      "ECOG_3_lowbeta_raw",
      "LFP_11_delta_raw",
      "ECOG_4_alpha_raw",
      "ECOG_3_alpha_raw",
      "LFP_15_lowbeta_raw",
      "LFP_12_lowbeta_raw",
      "LFP_13_beta_raw",
      "LFP_11_lowbeta_raw",
      "ECOG_2_highbeta_raw",
      "LFP_14_beta_raw",
      "LFP_9_beta_raw",
      "LFP_15_delta_raw",
      "LFP_10_beta_raw",
      "LFP_16_beta_raw"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_x",
      "tracing_acceleration_y",
      "tracing_acceleration_magnitude",
      "tracing_jerk_y",
      "tracing_jerk_magnitude"
    ]
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 80
  dbs_condition: "both"

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
