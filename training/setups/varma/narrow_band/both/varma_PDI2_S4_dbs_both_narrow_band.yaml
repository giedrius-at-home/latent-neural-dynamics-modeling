model:
  name: "varma_PDI2_S4_dbs_both_narrow_band"
  p: 30
  q: 1
  long_ar_lags: 30
  time_first: true
  fast: false
  reuse_splits: false
  forecast:
    m: 2
    history: 5

data:
  root: "resampled_recordings/participants_at_80Hz_scaled_1e6_narrow_band"
  participant: "PDI2"
  session: "4"
  blocks: "all"
  channels:
    neural_input: [
      "ECOG_2_highbeta_raw",
      "ECOG_1_highbeta_raw",
      "ECOG_3_highbeta_raw",
      "ECOG_2_beta_raw",
      "ECOG_3_beta_raw",
      "ECOG_3_lowbeta_raw",
      "ECOG_3_alpha_raw",
      "ECOG_1_beta_raw",
      "LFP_13_delta_raw",
      "ECOG_4_highbeta_raw",
      "ECOG_4_beta_raw",
      "LFP_11_theta_raw",
      "ECOG_2_lowbeta_raw",
      "LFP_12_alpha_raw",
      "LFP_13_theta_raw",
      "LFP_11_delta_raw",
      "LFP_14_theta_raw",
      "LFP_12_delta_raw",
      "LFP_11_alpha_raw",
      "LFP_12_theta_raw"
    ]
    output_type: "behavioral"
    output: [
      "tracing_acceleration_y",
      "tracing_acceleration_magnitude"
    ]
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 80
  dbs_condition: "both"

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
