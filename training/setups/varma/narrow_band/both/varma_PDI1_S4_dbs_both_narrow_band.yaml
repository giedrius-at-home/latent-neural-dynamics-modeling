model:
  name: "varma_PDI1_S4_dbs_both_narrow_band"
  p: 20
  q: 1
  long_ar_lags: 30
  time_first: true
  fast: false
  reuse_splits: false
  forecast:
    m: 2
    history: 5

data:
  root: "resampled_recordings/participants_at_80Hz_scaled_1e6_narrow_band"
  participant: "PDI1"
  session: "4"
  blocks: "all"
  channels:
    neural_input: [
      "ECOG_3_highbeta_raw",
      "ECOG_3_beta_raw",
      "LFP_12_delta_raw",
      "LFP_11_delta_raw",
      "LFP_10_delta_raw",
      "ECOG_2_beta_raw",
      "LFP_13_delta_raw",
      "LFP_15_lowbeta_raw",
      "LFP_16_delta_raw",
      "ECOG_3_lowbeta_raw",
      "LFP_14_lowbeta_raw",
      "LFP_9_delta_raw",
      "LFP_15_delta_raw",
      "LFP_14_delta_raw",
      "ECOG_2_highbeta_raw",
      "LFP_15_theta_raw",
      "LFP_14_theta_raw",
      "LFP_13_lowbeta_raw",
      "ECOG_2_lowbeta_raw",
      "LFP_13_theta_raw"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_x",
      "tracing_velocity_y",
      "tracing_velocity_magnitude",
      "tracing_jerk_x"
    ]
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 80
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
