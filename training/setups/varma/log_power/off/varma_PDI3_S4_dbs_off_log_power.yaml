model:
  name: "varma_PDI3_S4_dbs_off_log_power"
  p: 20
  q: 1
  long_ar_lags: 30
  time_first: true
  fast: false
  reuse_splits: true
  forecast:
    m: 2
    history: 5

data:
  root: "resampled_recordings/participants_at_80Hz_scaled_1e6_log"
  participant: "PDI3"
  session: "4"
  blocks: "all"
  channels:
    neural_input: [
      "LFP_15_lowbeta_log_power",
      "ECOG_1_beta_log_power",
      "ECOG_2_highbeta_log_power",
      "ECOG_4_beta_log_power",
      "LFP_14_lowbeta_log_power",
      "ECOG_2_theta_log_power",
      "LFP_13_lowbeta_log_power",
      "LFP_12_highbeta_log_power",
      "LFP_10_highbeta_log_power",
      "LFP_9_highbeta_log_power"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_y",
      "tracing_acceleration_x",
      "tracing_jerk_y",
      "tracing_jerk_magnitude"
    ]
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 80
  dbs_condition: "off"

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
