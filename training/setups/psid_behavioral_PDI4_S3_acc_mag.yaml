model:
  name: "psid_behavioral_PDI4_S3_acc_mag"
  nx: 16
  n1: 2 
  i: 30
  time_first: true
  forecast:
    m: 1 
    history: 2 

data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6_full_behavioral_fixed" 
  participant: "PDI4"
  session: "3"
  blocks: "all"
  channels:
    is_behavioral_neural: false
    input: ["ECOG_1_envelope", "ECOG_2_envelope", "ECOG_3_envelope", "ECOG_4_envelope", "LFP_13_envelope", "LFP_11_envelope"] 
    output: ["tracing_acceleration_y", "tracing_acceleration_magnitude"]
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"