model:
  name: "autoarima_PDI1_S2"
  sp: 1  
  max_p: 5 
  max_q: 5  
  max_d: 2  
  nx: 4  
  n1: 4  
  time_first: true
  fast: false
  reuse_splits: false
  forecast:
    m: 2  
    history: 5  

data:
  root: "resampled_recordings/participants_at_60Hz_scaled_1e6_all_bands_raw_05_28" 
  participant: "PDI1"
  session: "2"
  blocks: "all"
  channels:
    neural_input: [
      "ECOG_1_delta_raw", "ECOG_2_delta_raw", "ECOG_3_delta_raw", "ECOG_4_delta_raw",
      "ECOG_1_highbeta_env", "ECOG_2_highbeta_env", "ECOG_3_highbeta_env", "ECOG_4_highbeta_env"
    ]
    output_type: "behavioral"
    output: [
      "tracing_velocity_x", "tracing_velocity_y", "tracing_velocity_magnitude",
    ]
    input_lag: null
  split:
    within_session_split: true
    train: 0.6
    val: 0.2
    test: 0.2
    min_train_epochs: 50
  batch_size: 32
  sampling_frequency: 60
  dbs_condition: "both"
  jitter: 0

results:
  save_dir: "results/{model.name}"
  log_dir: "{results.save_dir}/logs"
  checkpoint_dir: "checkpoints"
