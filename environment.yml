name: neuro_local

channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - polars=1.34.*
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - plotly
  - streamlit
  - pyyaml
  - statsmodels
  - h5py
  - jupyterlab
  - mne
  - pip:
      - torch --index-url https://download.pytorch.org/whl/cpu
      - torchvision --index-url https://download.pytorch.org/whl/cpu
      - torchaudio --index-url https://download.pytorch.org/whl/cpu
      - tensorflow-cpu==2.15.1
      - plotly-resampler
      - anywidget
      - PSID==1.2.6
      - dpad==0.0.9
      - sktime
      - umap-learn
      - pmdarima
      - ray
