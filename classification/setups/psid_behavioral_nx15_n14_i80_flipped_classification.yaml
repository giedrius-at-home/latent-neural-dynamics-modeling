name: psid_behavioral_nx15_n14_i80_flipped_classification
run:
  dbs_on: 
    variant: "psid_behavioral_nx15_n14_i80_dbs_on"
    run_ts: "20260201_160320"
  dbs_off: 
    variant: "psid_behavioral_nx15_n14_i80_dbs_off"
    run_ts: "20260201_160346"
  dbs_both: 
    variant: "psid_behavioral_nx15_n14_i80_dbs_both"
    run_ts: "20260201_160240"

classification:
  flipped: true
  n_splits: 5
  epoch_length: 1.0     
  epoch_overlap: 0.5 
  sampling_freq: 60
  h: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]   
  m: [0.5, 1.0, 1.5, 2.0]         
  prediction_feature_source: Xp
  forecast_feature_source: Xp
  permutation_test: true
  n_permutations: 2
  param_grid:
    LDA:
      classifier__solver: ["lsqr", "svd", "eigen"]
      classifier__shrinkage: ["auto"]

results:
  project_root: "/home/bobby/repos/latent-neural-dynamics-modeling"
  results_dir: "{results.project_root}/results/{name}"
  log_dir: "{results.project_root}/logs/classification"

