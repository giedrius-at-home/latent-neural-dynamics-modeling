run:
  variant: "psid_behavioral_PDI1_4_nx_30_n8_i80_dbs_both_log_power"
  run_ts: "20260221_182200"

classification:
  flipped: false
  n_splits: 5
  epoch_length: 0.5     
  epoch_overlap: 0.25 
  sampling_freq: 80
  h: [0.5, 1.5, 2.5, 3.5, 4.5]   
  m: [0.5, 1.0, 2.0]  
  n1: 8
  nx: 30
  prediction_feature_source: Xp 
  forecast_feature_source: Xp 
  permutation_test: true
  n_permutations: 100
  param_grid:
    LDA:
      classifier__solver: ["lsqr", "svd", "eigen"]
      classifier__shrinkage: ["auto"]

results:
  project_root: "/home/bobby/repos/latent-neural-dynamics-modeling"
  results_dir: "{results.project_root}/results/{run.variant}"
  log_dir: "{results.project_root}/logs/classification"
