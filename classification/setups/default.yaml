run:
  variant: "psid_behavioral_nx15_n14_i80"
  run_ts: "20260127_052242"

classification:
  n_splits: 5
  epoch_length: 1.0     
  epoch_overlap: 0.5 
  sampling_freq: 60
  prediction_feature_source: Xp    # Xp, Yp, Y, or Both
  forecast_feature_source: Xp      # Xp or Yp
  permutation_test: true
  n_permutations: 1000
  param_grid:
    LDA:
      classifier__solver: ["lsqr", "svd", "eigen"]
      classifier__shrinkage: ["auto"]

results:
  project_root: "/home/bobby/repos/latent-neural-dynamics-modeling"
  results_dir: "{results.project_root}/results/{run.variant}"
  log_dir: "{results.project_root}/logs/classification"
