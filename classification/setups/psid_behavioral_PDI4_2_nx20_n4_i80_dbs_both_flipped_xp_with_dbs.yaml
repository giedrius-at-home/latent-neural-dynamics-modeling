name: psid_behavioral_PDI4_2_nx20_n4_i80_dbs_both_flipped

run:
  dbs_on: 
    variant: "psid_behavioral_PDI4_2_nx20_n4_i80_dbs_on"
    run_ts: "MISSING"
  dbs_off: 
    variant: "psid_behavioral_PDI4_2_nx20_n4_i80_dbs_off"
    run_ts: "MISSING"
  dbs_both: 
    variant: "psid_behavioral_PDI4_2_nx20_n4_i80_dbs_both"
    run_ts: "MISSING"

classification:
  flipped: true
  n_splits: 2
  epoch_length: 0.5     
  epoch_overlap: 0.25 
  sampling_freq: 80
  h: [0.5, 1.5, 2.5, 3.5, 4.5]   
  m: [0.5, 1.0, 2.0]
  n1: 16
  nx: 20         
  prediction_feature_source: Xp_with_dbs
  forecast_feature_source: Xp_with_dbs
  permutation_test: false
  n_permutations: 0
  param_grid:
    LDA:
      classifier__solver: ["lsqr", "svd", "eigen"]
      classifier__shrinkage: ["auto"]

results:
  project_root: "/home/giedriusmirklys/repos/latent-neural-dynamics-modeling"
  results_dir: "{results.project_root}/results/{name}"
  log_dir: "{results.project_root}/logs/classification"
