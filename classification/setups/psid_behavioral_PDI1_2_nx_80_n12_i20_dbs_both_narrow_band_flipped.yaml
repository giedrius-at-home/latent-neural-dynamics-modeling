name: psid_behavioral_PDI1_2_nx_80_n12_i20_dbs_both_narrow_band_flipped

run:
  dbs_on:
    variant: "psid_behavioral_PDI1_2_nx_80_n12_i20_dbs_on_narrow_band"
    run_ts: "20260403_115609"
  dbs_off:
    variant: "psid_behavioral_PDI1_2_nx_80_n12_i20_dbs_off_narrow_band"
    run_ts: "20260403_115841"
  dbs_both:
    variant: "psid_behavioral_PDI1_2_nx_80_n12_i20_dbs_both_narrow_band"
    run_ts: "20260403_115102"

classification:
  flipped: true
  n_splits: 2
  epoch_length: 0.5
  epoch_overlap: 0.25
  sampling_freq: 80
  h: [0.5, 3.5]
