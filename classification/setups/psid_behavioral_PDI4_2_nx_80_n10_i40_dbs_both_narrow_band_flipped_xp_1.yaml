name: psid_behavioral_PDI4_2_nx_80_n10_i40_dbs_both_narrow_band_flipped_xp_1

run:
  dbs_on:
    variant: "psid_behavioral_PDI4_2_nx_80_n10_i40_dbs_on_narrow_band"
    run_ts: "20260315_152130"
  dbs_off:
    variant: "psid_behavioral_PDI4_2_nx_80_n10_i40_dbs_off_narrow_band"
    run_ts: "20260315_160049"
  dbs_both:
    variant: "psid_behavioral_PDI4_2_nx_80_n10_i40_dbs_both_narrow_band"
