run:
  variant: "psid_behavioral_PDI4_3_nx65_n10_i40_dbs_both_narrow_band"
  run_ts: "20260315_200805"

classification:
  flipped: false
  n_splits: 5
  epoch_length: 0.5     
  epoch_overlap: 0.25 
  sampling_freq: 80
  h: [0.5, 1.5, 2.5, 3.5, 4.5]   
  m: [0.5, 1.0, 2.0]  
  n1: 10
  nx: 65
  prediction_feature_source: Xp_with_dbs
  forecast_feature_source: Xp_with_dbs
  permutation_test: false
  n_permutations: 0
  param_grid:
    LDA:
      classifier__solver: ["lsqr", "svd", "eigen"]
      classifier__shrinkage: ["auto"]

results:
  project_root: "/home/bobby/repos/latent-neural-dynamics-modeling"
  results_dir: "{results.project_root}/results/classification/{run.variant}"
  log_dir: "{results.project_root}/logs/classification"
