name: neuro
channels:
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - ipykernel
  - pip
  - seaborn
  - scikit-learn
  - tensorflow=2.15
  - jupyterlab
  - polars=1.34.*
  - scipy
  - python=3.11
  - matplotlib
  - black
  - pip:
      - PSID==1.2.6
      - dpad==0.0.9
      - mne==1.10.1
      - statsmodels==0.14.6
      # training/pipeline.py imports dpad_modal and psid_diagnostic at module
      # scope, so every run needs these three regardless of framework.
      - modal
      - feature-engine==1.9.4
      - mrmr-selection==0.2.8
prefix: /home/bobby/miniconda3/envs/neuro
