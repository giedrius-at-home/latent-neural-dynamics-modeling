name: "package_recordings"
root_directory: "/home/bobby/repos/latent-neural-dynamics-modeling"
data_directory: "{root_directory}/data"
save_directory: "{root_directory}/resampled_recordings"
logger_directory: "{root_directory}/logs"
participants_table_name: "participants.tsv"
participants_intermediate_table_name: "participants_2"
output_participants_table_name: "participants_at_20Hz_scaled_1e6_welch"
ieeg_process:
  resampled_dir: "{save_directory}/resampled_mat_recordings"
  chunk_margin: 2
  resampled_freq: 20
  notch_freqs: [50, 100, 150, 200]
  scale_factor: 1e6
  apply_car: true

  # Welch sliding-window log-power dB. Matches Sani et al. PSID/DPAD recipe.
  # Hop = original_sfreq / target_sfreq = 1000/20 = 50 samples (50 ms).
  # nperseg = 300 (300 ms window) — matches Sani et al. smoothing window;
  # 3.3 Hz native freq res, 1.8 cycles at 6 Hz theta. nfft=1024 zero-pads
  # to ~0.98 Hz virtual bins so every band (incl. 4 Hz-wide theta/alpha)
  # has multiple bins. noverlap = nperseg - hop = 250 (83% overlap),
  # auto-computed when null.
  welch_nperseg: 300
  welch_noverlap: null
  welch_nfft: 1024

  # Bands tightened around EU mains notches [50, 100, 150]. notch filter
  # applied at 1 kHz pre-welch attenuates ~±0.5 Hz; we add ~2.5 Hz buffer per
  # side so band power isn't biased by residual notch attenuation. Resulting
  # gaps: [47, 53] (50 Hz), [97, 103] (100 Hz), [147, 153] (150 Hz). Bands
  # stop at 168 (no 200 Hz concern). 30 bands total.
  welch_log_power_bands:
    theta:         [4,   8]
    alpha:         [8,   12]
    beta_1:        [13,  18]
    beta_2:        [18,  23]
    beta_3:        [23,  28]
    beta_4:        [28,  32]
    lowgamma_1:    [32,  37]
    lowgamma_2:    [37,  42]
    lowgamma_3:    [42,  47]
    midgamma_1:    [53,  58]
    midgamma_2:    [58,  63]
    midgamma_3:    [63,  68]
    midgamma_4:    [68,  73]
    midgamma_5:    [73,  78]
    midgamma_6:    [78,  83]
    midgamma_7:    [83,  88]
    midgamma_8:    [88,  93]
    midgamma_9:    [93,  97]
    highgamma1_1:  [103, 108]
    highgamma1_2:  [108, 113]
    highgamma1_3:  [113, 118]
    highgamma1_4:  [118, 123]
    highgamma1_5:  [123, 128]
    highgamma1_6:  [128, 133]
    highgamma1_7:  [133, 138]
    highgamma1_8:  [138, 143]
    highgamma1_9:  [143, 147]
    highgamma2_1:  [153, 158]
    highgamma2_2:  [158, 163]
    highgamma2_3:  [163, 168]
