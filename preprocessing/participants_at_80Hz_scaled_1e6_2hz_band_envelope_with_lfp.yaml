name: "package_recordings"
root_directory: "/home/bobby/repos/latent-neural-dynamics-modeling"
data_directory: "{root_directory}/data"
save_directory: "{root_directory}/resampled_recordings"
logger_directory: "{root_directory}/logs"
participants_table_name: "participants.tsv"
participants_intermediate_table_name: "participants_2"
output_participants_table_name: "participants_at_80Hz_scaled_1e6_2hz_band_envelope_with_lfp"
ieeg_process:
  resampled_dir: "{save_directory}/resampled_mat_recordings"
  chunk_margin: 2
  resampled_freq: 80
  notch_freqs: []
  scale_factor: 1e6
  compute_average: true
  drop_lfp: false
  max_pause_seconds: 2.0
  raw_bands:
    delta_1_raw: [1.0, 3.0]
    delta_3_raw: [3.0, 5.0]
    theta_5_raw: [5.0, 7.0]
    theta_7_raw: [7.0, 9.0]
    alpha_9_raw: [9.0, 11.0]
    alpha_11_raw: [11.0, 13.0]
  envelope_bands:
    beta_13_env: [13, 15]
    beta_15_env: [15, 17]
    beta_17_env: [17, 19]
    beta_19_env: [19, 21]
    beta_21_env: [21, 23]
    beta_23_env: [23, 25]
    beta_25_env: [25, 27]
    beta_27_env: [27, 29]
    beta_29_env: [29, 30]
