name: "package_recordings"
root_directory: "/home/bobby/repos/latent-neural-dynamics-modeling"
data_directory: "{root_directory}/data"
save_directory: "{root_directory}/resampled_recordings"
logger_directory: "{root_directory}/logs"
participants_table_name: "participants.tsv"
participants_intermediate_table_name: "participants_2"
output_participants_table_name: "participants_at_80Hz_scaled_1e6_narrow_band_envelope"
ieeg_process:
  resampled_dir: "{save_directory}/resampled_mat_recordings"
  chunk_margin: 2
  resampled_freq: 80
  notch_freqs: []
  scale_factor: 1e6
  raw_bands:
    delta_raw: [0.5, 4]
    theta_raw: [5, 8]
    alpha_raw: [9, 12]
  envelope_bands:
    lowbeta_env: [13, 16]
    beta_env: [17, 20]
    highbeta_env: [21, 35]
