name: "package_recordings"
root_directory: "/home/bobby/repos/latent-neural-dynamics-modeling"
data_directory: "{root_directory}/data"
save_directory: "{root_directory}/resampled_recordings"
logger_directory: "{root_directory}/logs"
participants_table_name: "participants.tsv"
participants_intermediate_table_name: "participants_2"
output_participants_table_name: "participants_at_35Hz_scaled_1e6_narrow_band_envelope"
ieeg_process:
  resampled_dir: "{save_directory}/resampled_mat_recordings"
  chunk_margin: 2
  resampled_freq: 35
  notch_freqs: [50, 100, 150, 200]
  scale_factor: 1e6
  apply_car: true

  # Hybrid features at 35 Hz output (Nyquist = 17.5 Hz):
  #   raw_bands       — theta, alpha, beta_low: ≤ 17 Hz, raw narrow-band
  #                     waveforms (preserve phase → A captures the
  #                     oscillation). beta_low is beta_1 [13,18] capped at
  #                     17 to stay below Nyquist (drops 17–18 Hz sliver).
  #   envelope_bands  — bands > 17 Hz: Hilbert envelope, 200 ms smoothing,
  #                     decimate to 35 Hz. Phase discarded (would alias)
  #                     but slow envelope dynamics fit within Nyquist.
  # Same EU notch buffer as the welch yaml (gaps around 50/100/150 Hz).

  raw_bands:
    theta:        [4,   8]
    alpha:        [8,   12]
    beta_low:     [13,  17]

  envelope_bands:
    beta_2:        [18,  23]
    beta_3:        [23,  28]
    beta_4:        [28,  32]
    lowgamma_1:    [32,  37]
    lowgamma_2:    [37,  42]
    lowgamma_3:    [42,  47]
    midgamma_1:    [53,  58]
    midgamma_2:    [58,  63]
    midgamma_3:    [63,  68]
    midgamma_4:    [68,  73]
    midgamma_5:    [73,  78]
    midgamma_6:    [78,  83]
    midgamma_7:    [83,  88]
    midgamma_8:    [88,  93]
    midgamma_9:    [93,  97]
    highgamma1_1:  [103, 108]
    highgamma1_2:  [108, 113]
    highgamma1_3:  [113, 118]
    highgamma1_4:  [118, 123]
    highgamma1_5:  [123, 128]
    highgamma1_6:  [128, 133]
    highgamma1_7:  [133, 138]
    highgamma1_8:  [138, 143]
    highgamma1_9:  [143, 147]
    highgamma2_1:  [153, 158]
    highgamma2_2:  [158, 163]
    highgamma2_3:  [163, 168]
